[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gcritic-stats"
version = "0.1.0"
description = "gcritic: статистика активности"
requires-python = ">=3.15,<3.16"
dependencies = ["gcritic-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/gcritic_stats"]
