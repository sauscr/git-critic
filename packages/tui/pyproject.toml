[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gcritic-tui"
version = "0.1.0"
description = "gcritic: консольная оболочка"
requires-python = ">=3.15,<3.16"
dependencies = [
    "gcritic-core",
    "rich>=13.7",
    "prompt_toolkit>=3.0.48",
    "pyfiglet>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gcritic_tui"]
