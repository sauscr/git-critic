# Корень uv workspace: сам не пакет, собирает члены и dev-инструменты.
[project]
name = "gcritic-workspace"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = ["gcritic"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
gcritic = { workspace = true }
gcritic-core = { workspace = true }
gcritic-git = { workspace = true }
gcritic-critic = { workspace = true }
gcritic-stats = { workspace = true }
gcritic-tui = { workspace = true }

[tool.ruff]
line-length = 100
extend-exclude = ["git_critic.py"]  # v0, оставлен для сверки поведения

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица и псевдографика в строках — намеренно
    "RUF009",  # field() с metadata в settings.py — намеренно
    "N818",  # ExitShell — сигнал выхода, а не ошибка
]

[tool.ruff.lint.per-file-ignores]
"packages/critic_svc/src/gcritic_critic/config.py" = ["E501"]  # промпт

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
pythonpath = ["tests"]
